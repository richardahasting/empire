# =============================================================================
# EMPIRE — world configuration schema
# =============================================================================
#
# This file is the *schema*, written as a fully-populated, commented YAML
# document. Every key here is a knob the engine reads; nothing gameplay-
# relevant is hardcoded. A world is created from ONE file of this shape.
# The presets in config/presets/ override a subset of these values.
#
# Conventions
#   - All rates are PER ETU (Empire Time Unit) unless the key name says
#     _per_update. An update is schedule.etus_per_update ETUs; the engine
#     multiplies. This is how the same rules scale from a months-long game
#     to a one-evening blitz.
#   - Every percentage is 0..100 (efficiency, road_level), every fraction
#     is 0.0..1.0 (rates, multipliers).
#   - Commodity ids: civ mil uw food iron dust bar oil pet shell gun lcm hcm rad
#   - Terrain ids:   ocean wilderness mountain plains forest   (+ swamp, optional)
#
# Provenance markers, so Richard can decide the rule himself:
#   KNOWN:  value or mechanic taken from the Wolfpack Empire econfig defaults
#           or server source as I remember them. Treat as "probably right".
#   GUESS:  I do not know what the original did, or I know it did something
#           this design has deliberately replaced. The number is a plausible
#           starting point for the balance harness, nothing more.
#   NEW:    mechanic that has no counterpart in the original (rail, reach
#           limits, probabilistic radar, agents, handicaps). No original to
#           be faithful to; the value is a design choice.
#
# Validation: the loader (empire-config module) rejects unknown keys, missing
# required keys, out-of-range values, and cross-references that do not
# resolve (a sector type that consumes a commodity not in the commodity
# table, a preset that names a country twice, etc.). Load-time errors name
# the YAML path.
# =============================================================================

schema_version: 1

# -----------------------------------------------------------------------------
# WORLD
# -----------------------------------------------------------------------------
world:
  name: "Classic"
  width: 128                 # KNOWN: Wolfpack default 64x32; the prompt asks 128x64.
  height: 64
  wrap_x: true               # KNOWN: original world wraps in both axes (torus).
  wrap_y: true               #        GUESS: prompt never says; keeping the torus.
  seed: 20260907             # Master seed. Every RNG stream is derived from it.

  # Hex grid. Internally offset coordinates (odd-r); player-facing coordinates
  # are relative to the country's capital, as the original did.
  # KNOWN: the original's grid was a "brick" layout — each row shifted half a
  # sector, x+y always even — which is topologically a hex grid. The player-
  # facing convention (x,y with x±2 as E/W neighbours) is preserved by the
  # coordinate adapter, not the engine.
  coordinates:
    player_facing: "original_brick"   # original_brick | axial

  terrain:
    generator: "fairland"      # KNOWN: name of the original's world generator.
    land_fraction: 0.30
    island_size: 25            # mean sectors per island/continent seed
    continent_count: 0         # 0 = one continent per country (fairland default)
    spike: 10                  # KNOWN fairland knob: coastline jaggedness 0..100
    min_distance_between_capitals: 12   # in sectors; validation rejects if impossible
    # GUESS: the original had no plains/forest terrain — those were designations
    # on wilderness, and terrain was derived from elevation (<0 sea, high =
    # mountain). This design adds plains/forest/swamp as *terrain*. Fractions
    # below apply to land only and must sum to 1.0.
    land_mix: { wilderness: 0.40, plains: 0.30, forest: 0.18, mountain: 0.10, swamp: 0.02 }
  # Elevation feeds radar range and rail/road cost. Metres, generated per sector.
  elevation_by_terrain:
    ocean:      { min: -200, max: 0 }
    wilderness: { min: 0,   max: 400 }
    plains:     { min: 0,   max: 150 }
    forest:     { min: 50,  max: 600 }
    swamp:      { min: 0,   max: 20 }
    mountain:   { min: 600, max: 3000 }

  # Per-sector resource endowments, 0..100, drawn at generation.
  # KNOWN: original resources (fert, min, gold, oil, uran) were functions of
  # elevation — minerals and gold high in mountains, fertility low there.
  # GUESS: exact curves. Expressed here as per-terrain triangular distributions.
  resources:
    fertility:   { wilderness: [20,60,90], plains: [50,80,100], forest: [20,45,70], swamp: [10,30,50], mountain: [0,5,20] }
    minerals:    { wilderness: [0,20,60],  plains: [0,10,30],   forest: [0,15,40],  swamp: [0,5,10],   mountain: [30,70,100] }
    gold:        { wilderness: [0,5,40],   plains: [0,2,10],    forest: [0,5,20],   swamp: [0,0,5],    mountain: [10,40,100] }
    oil:         { wilderness: [0,10,60],  plains: [0,15,70],   forest: [0,5,30],   swamp: [10,40,90], mountain: [0,0,10] }
    uranium:     { wilderness: [0,5,40],   plains: [0,2,20],    forest: [0,3,20],   swamp: [0,0,5],    mountain: [5,30,100] }
    # NEW (Richard 2026-09-09, issue #56): fishing grounds. One draw per region of region_size² sea
    # hexes, jittered per hex, so "different areas of ocean have different fertility".
    sea_fertility: { region_size: 4, triangular: [5, 40, 90], jitter: 10 }

# -----------------------------------------------------------------------------
# SCHEDULE / TIME
# -----------------------------------------------------------------------------
schedule:
  update_interval: "24h"       # ISO-ish duration: 15m, 1h, 24h
  etus_per_update: 60          # KNOWN: Wolfpack default etu_per_update = 60
  first_update_at: "2026-10-01T03:00:00Z"
  pause_on_failed_update: true # a rolled-back update halts the schedule and pages the deity
  max_updates: 0               # 0 = unbounded; blitz presets set a hard end

# -----------------------------------------------------------------------------
# PLAYERS / COUNTRIES
# -----------------------------------------------------------------------------
players:
  max_countries: 40
  starting_cash: 25000         # KNOWN: constants.c start_cash = 25000
  # KNOWN-ish: Wolfpack `newcap` seeds the capital with civs and food. Exact
  # numbers were deity-set. GUESS at the split between the two sanctuaries.
  starting_commodities:
    capital:    { civ: 550, mil: 55, uw: 0, food: 1000, iron: 0, dust: 0, bar: 0, oil: 0, pet: 0, shell: 0, gun: 0, lcm: 100, hcm: 0, rad: 0 }
    sanctuary:  { civ: 550, mil: 55, uw: 0, food: 1000, iron: 0, dust: 0, bar: 0, oil: 0, pet: 0, shell: 0, gun: 0, lcm: 100, hcm: 0, rad: 0 }
  starting_efficiency: 100     # KNOWN: sanctuary sectors start at 100%
  starting_mobility: 127       # KNOWN: sector mobility cap is 127
  starting_levels: { tech: 0, research: 0, education: 0, happiness: 0 }
  # Sanctuary: the country's two sectors are invisible and invulnerable, and
  # the country cannot act outside them, until it breaks sanctuary.
  # KNOWN: original sanctuary rules. GUESS: what "frozen" means for updates —
  # this design runs the update normally inside sanctuary (civs grow, food is
  # eaten) so a player who waits is not penalised for it. Set false to freeze.
  sanctuary:
    update_runs_while_in_sanctuary: true
    break_costs_btu: 0

  # Optional per-country overrides. Names must be unique. Absent here, the
  # deity adds countries through the admin API before the first update.
  countries: []
  #  - name: Sonnet
  #    controller: agent                     # human | agent
  #    agent: { adapter: anthropic, model: claude-sonnet-4-6 }
  #    handicap: { btu_rate: 0.80 }
  #  - name: Rick
  #    controller: human

# -----------------------------------------------------------------------------
# COMMODITIES — the master table. Everything else references these ids.
# -----------------------------------------------------------------------------
commodities:
  # weight: the original's lbs (KNOWN: item.config). Shipping weight = lbs / packing[class of the
  #   sector the goods LEAVE], packing applying only at >= 60% efficiency ("inefficient" otherwise).
  #   KNOWN: civilians pack 10 in any efficient sector; goods pack 10 out of a warehouse; bars 5
  #   out of a warehouse and 4 out of a bank; uw 2 out of a warehouse.
  # signature: how visible held stock is to detection (NEW; see detection).
  # priority: contention tiebreak in the distribution planner — lower wins (NEW).
  - { id: civ,   name: civilians,           weight: 1.0,  signature: 0.3, priority: 10, is_person: true, packing: { inefficient: 1, normal: 10, warehouse: 10, urban: 10, bank: 10 } }
  - { id: mil,   name: military,            weight: 1.0,  signature: 1.0, priority: 20, is_person: true, packing: { inefficient: 1, normal: 1,  warehouse: 1,  urban: 1,  bank: 1 } }
  - { id: uw,    name: uncompensated workers, weight: 2.0, signature: 0.3, priority: 30, is_person: true, packing: { inefficient: 1, normal: 1,  warehouse: 2,  urban: 1,  bank: 1 } }
  - { id: food,  name: food,                weight: 1.0,  signature: 0.1, priority: 1,  packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: iron,  name: iron ore,            weight: 1.0,  signature: 0.1, priority: 40, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: dust,  name: gold dust,           weight: 5.0,  signature: 0.0, priority: 50, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: bar,   name: gold bars,           weight: 50.0, signature: 0.0, priority: 50, packing: { inefficient: 1, normal: 1, warehouse: 5,  urban: 1, bank: 4 } }
  - { id: oil,   name: oil,                 weight: 1.0,  signature: 0.1, priority: 45, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: pet,   name: petrol,              weight: 1.0,  signature: 0.2, priority: 5,  packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: shell, name: shells,              weight: 1.0,  signature: 0.5, priority: 60, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: gun,   name: guns,                weight: 10.0, signature: 0.8, priority: 60, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: lcm,   name: light construction materials, weight: 1.0, signature: 0.1, priority: 2, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: hcm,   name: heavy construction materials, weight: 1.0, signature: 0.1, priority: 3, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }
  - { id: rad,   name: radioactive material, weight: 8.0,  signature: 0.2, priority: 70, packing: { inefficient: 1, normal: 1, warehouse: 10, urban: 1, bank: 1 } }

# -----------------------------------------------------------------------------
# TERRAIN — per-terrain modifiers referenced by mobility and infrastructure
# -----------------------------------------------------------------------------
terrain:
  ocean:      { passable_by_land: false, base_move_cost: null }
  wilderness: { passable_by_land: true,  base_move_cost: 1.0 }
  plains:     { passable_by_land: true,  base_move_cost: 0.8 }
  forest:     { passable_by_land: true,  base_move_cost: 1.4 }
  swamp:      { passable_by_land: true,  base_move_cost: 2.0 }
  mountain:   { passable_by_land: true,  base_move_cost: 2.5 }

# -----------------------------------------------------------------------------
# ECONOMY
# -----------------------------------------------------------------------------
economy:

  # --- Population ------------------------------------------------------------
  population:
    food_per_civ_per_etu: 0.0005      # KNOWN: eatrate 0.0005
    food_per_mil_per_etu: 0.0005      # KNOWN: same eatrate
    food_per_uw_per_etu:  0.0005
    civ_birth_rate_per_etu: 0.005     # KNOWN: obrate 0.005
    uw_birth_rate_per_etu:  0.0025    # KNOWN: uwbrate 0.0025
    food_per_birth: 0.006             # KNOWN: babyeat 0.0060 (constants.c)
    # Subsistence. KNOWN: the original let a few hundred civilians per sector live off the
    # land. Richard 2026-09-07: "people don't starve unless they have a gun to their head.
    # Let them hunt, fish, and gather food." People up to this limit eat nothing from stock
    # and never starve; only the people beyond it need food. Births under the limit need
    # no stocked food either.
    subsistence:
      civs_per_sector: 300            # 300 was the original's number; Richard suspects it is high — tune in the harness
      scale_by_fertility: true        # limit × fertility/100 (an 80-fertility plain feeds 240; a 5-fertility mountain, 15)
      applies_to: [civ, uw, mil]      # who forages, in this order
    # Starvation: when food runs out, a fraction of each population class dies.
    # KNOWN: original starved proportionally to shortfall. GUESS: cap per update.
    starvation_max_fraction_per_update: 0.5   # KNOWN: famine_victims() starves at most half
    starvation_order: [uw, civ, mil]            # KNOWN: feed_people() order
    birth_food_reserve_factor: 2                # KNOWN: babies() allows food / (2 × babyeat) births
    max_pop_scales_with_efficiency: false       # KNOWN: max_population() is flat except big cities
    # Population ceiling per sector = sector_type.max_population, flat (KNOWN: res_pop.c),
    # optionally scaled by research with the original's RES_POP formula.
    max_pop_research_curve: { type: none }      # KNOWN: option RES_POP (off by default) would be { type: res_pop }
    # Plague. KNOWN mechanic; GUESS defaults. options.plague toggles.
    plague:
      base_probability_per_etu: 0.00005
      crowding_exponent: 1.5
      mortality: 0.10
      duration_updates: 3

  # --- Work ------------------------------------------------------------------
  # Each civ contributes 1 work-unit, each uw and mil a fraction. Production is
  # limited by min(work available, materials available) scaled by efficiency.
  # KNOWN: this three-way min is the original model. GUESS at uw/mil factors.
  work:
    per_civ: 1.0
    per_uw:  1.0
    per_mil: 0.5
    happiness_effect_curve: { neutral_at: 0, slope_per_point: 0.01, min: 0.5, max: 1.2 }

  # --- Sector types ------------------------------------------------------------
  # One entry per designation. Fields:
  #   glyph            single char for the console map (KNOWN: original letters)
  #   category         extraction | manufacturing | infrastructure | social | special
  #   build            materials + cash per efficiency point when building up
  #   max_population   at 100% efficiency, before research scaling
  #   produces         { commodity: units per work-unit per ETU at eff 100 }
  #   consumes         { commodity: units per unit produced } (material inputs)
  #   resource_gate    which sector resource (fertility/minerals/...) scales output
  #   level_effect     national level that scales output and its curve id
  #   min_tech         tech required to designate
  #   capacity         per-commodity storage max; unlisted = default_capacity
  #   store_multiplier warehouse-style storage bonus (applies to all commodities)
  #   flags            special behaviours the engine knows by name
  #
  # PROVENANCE: glyphs, the categories, and the input→output chains are KNOWN
  # (iron→lcm/hcm, oil→pet, dust→bar, lcm+hcm+oil→shell, etc.). Every numeric
  # rate is a GUESS calibrated against nothing yet — the M0 balance harness
  # exists to fix that. Treat the numbers as placeholders.
  default_capacity: 9999      # KNOWN: original per-sector item cap 9999 (warehouses store no more; they SHIP cheaper)
  # KNOWN throughout this table unless marked (sect.config + product.config, gefla/empserver master):
  #   build:  materials and cash per efficiency point. Nearly every type: $1 a point and NOTHING else
  #           (cost 100, l_b 0, h_b 0). Fortress: 1 hcm + $5 a point. Terrain types cost nothing.
  #   produces: units per work-unit·ETU. The original's output per person-ETU is
  #           (1/100) × (1/bwork) × peffic/100 × level curve, times efficiency and the resource gate.
  #           With our work pool = people × ETUs that is 0.01/bwork × peffic/100.
  #   consumes: inputs per unit produced (product.config ct/ca).
  #   production_cash_per_unit: $ per unit produced (product.config cost).
  #   packing: shipping-weight class (sect.config pkg): normal | warehouse | bank | urban.
  #   max_population: 1000 for every designated land sector; mountain and wilderness-like terrain 100.
  sector_types:
    # --- special -------------------------------------------------------------
    - id: wilderness
      glyph: "-"
      category: special
      build: {}
      max_population: 1000            # KNOWN: wilderness 1000; mountain would be 100
      flags: [undesignated]
    - id: sanctuary
      glyph: "/"
      category: special
      max_population: 1000
      flags: [invulnerable, invisible, no_designate]
    - id: wasteland
      glyph: "\\"
      category: special
      max_population: 0
      flags: [no_designate, fallout_origin]

    # --- infrastructure ------------------------------------------------------
    - id: capital
      glyph: "c"
      category: infrastructure
      build: { cash: 1 }
      maintenance_cash_per_etu: 1     # KNOWN: maint 1
      max_population: 1000
      flags: [btu_source, one_per_country_active]
    - id: city                         # NEW (Richard 2026-09-08, issue #41): "the version I played in 1987 had urban areas".
      glyph: "U"                       #   Modelled on the original's big city: ten times the people, civilians leave at
      category: infrastructure         #   1/10 weight (urban packing), built with 100 lcm + 200 hcm to 100% (KNOWN: BIG_CITY
      build: { cash: 1, lcm: 1, hcm: 2 }   #   l_b 100, h_b 200). Storage scales with it so the people fit.
      max_population: 10000
      store_multiplier: 10
      packing: urban
    - id: warehouse
      glyph: "w"
      category: infrastructure
      build: { cash: 1 }
      max_population: 1000
      packing: warehouse               # KNOWN: goods leave a warehouse at 1/10 weight; it does NOT store more
      flags: [distribution_hub]
    - id: harbor
      glyph: "h"
      category: infrastructure
      build: { cash: 1 }
      max_population: 1000
      packing: warehouse               # KNOWN: harbors pack like warehouses
      flags: [coastal_required, builds_ships]
    - id: airfield
      glyph: "*"
      category: infrastructure
      build: { cash: 1 }
      max_population: 1000
      flags: [builds_planes]
    - id: depot                        # NEW: rail endpoint (no original counterpart)
      glyph: "="
      category: infrastructure
      build: { cash: 1, hcm: 1 }
      max_population: 1000
      min_tech: 50
      packing: warehouse
      flags: [rail_endpoint, distribution_hub]
    - id: fortress
      glyph: "f"
      category: infrastructure
      build: { hcm: 1, cash: 5 }      # KNOWN: h_b 100, cost 500
      max_population: 1000
      flags: [defense_bonus]
    - id: radar
      glyph: ")"
      category: infrastructure
      build: { cash: 1 }
      max_population: 1000
      flags: [radar_station]
    - id: nuclear_plant
      glyph: "n"
      category: infrastructure
      build: { cash: 1 }
      max_population: 1000
      flags: [builds_nukes]

    # --- extraction ----------------------------------------------------------
    - id: agribusiness
      glyph: "a"
      category: extraction
      build: { cash: 1 }
      max_population: 1000
      produces: { food: 0.09 }        # KNOWN: bwork 1, peffic 900 -> 0.01 × 9
      resource_gate: fertility
      level_effect: { level: tech, curve: tech_easy }
    - id: forest                       # NEW (Richard keeps it): a weak second lcm source on forest terrain — GUESS rate
      glyph: "F"
      category: extraction
      build: { cash: 1 }
      max_population: 1000
      produces: { lcm: 0.002 }
      level_effect: { level: tech, curve: tech_easy }   # NEW (Richard 2026-09-09): tech scales every production value
      resource_gate: fertility
      terrain_required: [forest]
    - id: mine
      glyph: "m"
      category: extraction
      build: { cash: 1 }
      max_population: 1000
      produces: { iron: 0.01 }        # KNOWN: bwork 1, peffic 100, no level effect, depletes nothing
      level_effect: { level: tech, curve: tech_easy }   # NEW (Richard 2026-09-09): tech scales every production value
      resource_gate: minerals
    - id: gold_mine
      glyph: "g"
      category: extraction
      build: { cash: 1 }
      max_population: 1000
      produces: { dust: 0.01 }        # KNOWN (the original also depletes gold 20 per 100 units — NEW: we do not deplete yet)
      level_effect: { level: tech, curve: tech_easy }   # NEW (Richard 2026-09-09): tech scales every production value
      resource_gate: gold
    - id: oil_field
      glyph: "o"
      category: extraction
      build: { cash: 1 }
      max_population: 1000
      produces: { oil: 0.01 }         # KNOWN; depletes oil 10 per 100 units in the original (not modelled yet)
      resource_gate: oil
      level_effect: { level: tech, curve: tech_easy }
    - id: uranium_mine
      glyph: "u"
      category: extraction
      build: { cash: 1 }
      max_population: 1000
      produces: { rad: 0.01 }         # KNOWN; $2 each; tech 40; depletes 35 per 100
      production_cash_per_unit: 2
      resource_gate: uranium
      level_effect: { level: tech, curve: tech40 }

    # --- manufacturing -------------------------------------------------------
    - id: light_manufacturing
      glyph: "j"
      category: manufacturing
      build: { cash: 1 }
      max_population: 1000
      produces: { lcm: 0.01 }         # KNOWN: bwork 1
      consumes: { iron: 1.0 }         # KNOWN: 1 iron -> 1 lcm
      level_effect: { level: tech, curve: tech_easy }
    - id: heavy_industry
      glyph: "k"
      category: manufacturing
      build: { cash: 1 }
      max_population: 1000
      produces: { hcm: 0.005 }        # KNOWN: bwork 2
      consumes: { iron: 2.0 }         # KNOWN: 2 iron -> 1 hcm
      level_effect: { level: tech, curve: tech_easy }
    - id: refinery
      glyph: "%"
      category: manufacturing
      build: { cash: 1 }
      max_population: 1000
      produces: { pet: 0.1 }          # KNOWN: bwork 1, peffic 1000: 1 oil -> 10 petrol, $1 per petrol
      consumes: { oil: 0.1 }
      production_cash_per_unit: 1
      level_effect: { level: tech, curve: tech20 }
    - id: shell_plant
      glyph: "i"
      category: manufacturing
      build: { cash: 1 }
      max_population: 1000
      produces: { shell: 0.00333 }    # KNOWN: bwork 3; 2 lcm + 1 hcm -> 1 shell; $3 each; tech 20
      consumes: { lcm: 2.0, hcm: 1.0 }
      production_cash_per_unit: 3
      level_effect: { level: tech, curve: tech20 }
    - id: gun_plant
      glyph: "d"                      # KNOWN: the original "defense plant" makes guns
      category: manufacturing
      build: { cash: 1 }
      max_population: 1000
      produces: { gun: 0.000625 }     # KNOWN: bwork 16; 1 oil + 5 lcm + 10 hcm -> 1 gun; $30 each; tech 20
      consumes: { oil: 1.0, lcm: 5.0, hcm: 10.0 }
      production_cash_per_unit: 30
      level_effect: { level: tech, curve: tech20 }
    - id: defense_plant             # NEW (Richard's spec lists it separately; the original has only the gun plant) — GUESS
      glyph: "D"
      category: manufacturing
      build: { cash: 1, hcm: 1 }
      max_population: 1000
      min_tech: 60
      produces: { shell: 0.001, gun: 0.0002 }
      level_effect: { level: tech, curve: tech20 }   # NEW (Richard 2026-09-09): tech scales every production value
      consumes: { lcm: 3.0, hcm: 5.0 }
      production_cash_per_unit: 10
    - id: bank
      glyph: "b"
      category: manufacturing
      build: { cash: 1 }
      max_population: 1000
      produces: { bar: 0.002 }        # KNOWN: bwork 5; 5 dust -> 1 bar; $10 each
      level_effect: { level: tech, curve: tech_easy }   # NEW (Richard 2026-09-09): tech scales every production value
      consumes: { dust: 5.0 }
      production_cash_per_unit: 10
      packing: bank
      flags: [interest_bearing]

    # --- social --------------------------------------------------------------
    - id: enlistment_center
      glyph: "e"
      category: social
      build: { cash: 1 }
      max_population: 1000
      produces: { mil: 0.001 }        # GUESS: the original enlists ETU × (10 + mil) × 0.05 per update at >= 60%, $3 each, up to civ/2 − mil
      level_effect: { level: tech, curve: tech_easy }   # NEW (Richard 2026-09-09): tech scales every production value
      consumes: { civ: 1.0 }
      production_cash_per_unit: 3
    - id: school                      # NEW two-tier ladder (Richard keeps it). Original "library/school": 1 lcm -> 1 education, $9
      glyph: "l"
      category: social
      build: { cash: 1 }
      max_population: 1000
      produces_level: { education: 0.01 }
      consumes: { lcm: 1.0 }
      production_cash_per_unit: 9
    - id: university                  # NEW — GUESS
      glyph: "L"
      category: social
      build: { cash: 1, hcm: 1 }
      max_population: 1000
      min_tech: 20
      produces_level: { education: 0.02 }
      consumes: { lcm: 2.0, hcm: 1.0 }
      production_cash_per_unit: 18
    - id: research_lab
      glyph: "r"
      category: social
      build: { cash: 1 }
      max_population: 1000
      produces_level: { research: 0.000625 }   # KNOWN: bwork 16; 1 dust + 5 oil + 10 lcm -> 1 research; $90; needs education 5
      consumes: { dust: 1.0, oil: 5.0, lcm: 10.0 }
      production_cash_per_unit: 90
      level_effect: { level: education, curve: edu5 }
    - id: technical_center
      glyph: "t"
      category: social
      build: { cash: 1 }
      max_population: 1000
      produces_level: { tech: 0.000625 }       # KNOWN: same inputs as research; $300 per tech
      consumes: { dust: 1.0, oil: 5.0, lcm: 10.0 }
      production_cash_per_unit: 300
      level_effect: { level: education, curve: edu5 }
    - id: hospital                    # NEW (Richard 2026-09-07): plague counter ONLY. Inert when options.plague is false.
      glyph: "H"
      category: social
      build: { cash: 1 }
      max_population: 1000
      min_tech: 30
      consumes: { lcm: 0.5 }
      flags: [plague_mitigation]
      plague_mitigation:
        radius_sectors: 2
        mortality_multiplier_at_100: 0.4
        probability_multiplier_at_100: 0.6
        stacking: min
    - id: park
      glyph: "p"
      category: social
      build: { cash: 1 }
      max_population: 1000
      # NEW (Richard 2026-09-09): "parks should create happy strollers" — happiness from the people who
      # use it, no materials. Was KNOWN 1 lcm -> 1 happiness, $9; the rate is a GUESS to tune.
      produces_level: { happiness: 0.005 }
      production_cash_per_unit: 1        # Richard 2026-09-09: "shouldn't require anything except food and a little cash"

  # --- Production curves -----------------------------------------------------
  # Named curves referenced by sector_types.level_effect. Evaluated as
  # multiplier = f(level). KNOWN: original used prod_eff(level) = level /
  # (level + tech_factor) style saturating curves (tech_factor 50 in Wolfpack
  # for some sectors). GUESS at every constant.
  curves:
    # KNOWN (produce.c prod_eff): level_p_e = (level − nlmin) / (level − nlmin + nllag), zero below nlmin.
    # nlmin/nllag per product from product.config.
    tech_easy:         { type: wolfpack, min: -10, lag: 10 }   # food, oil, lcm, hcm: 0.5 at tech 0
    tech20:           { type: wolfpack, min: 20,  lag: 10 }   # shells, guns, petrol: nothing below tech 20
    tech40:           { type: wolfpack, min: 40,  lag: 10 }   # radioactive materials
    edu5:             { type: wolfpack, min: 5,   lag: 10 }   # tech and research need education 5
    level_diminishing: { type: log, base: 2.0, easy: 1.0 }    # KNOWN: tech_log_base=2, easy_tech=1
    flat:              { type: constant, value: 1.0 }

  # --- Sector efficiency build-up -------------------------------------------
  # Efficiency rises each update by spending sector_types[].build materials
  # per point plus work. KNOWN: original "buil" rate; GUESS at the constants.
  efficiency:
    # KNOWN (update/sect.c buildeff): half of the sector's available work may go to construction,
    # at bwork = 100 work-hundredths per point, i.e. ONE efficiency point per work unit, where a
    # sector's work per update is people × ETUs / 100. A 1000-civilian sector builds 100% in one
    # update; a 100-civilian one gains 30 points. No per-update cap beyond that.
    # In our units work = people × ETUs, so work_per_point = 100 and the share is 1/2.
    max_points_per_etu: 100              # effectively uncapped: work is the limit (KNOWN)
    work_per_point: 100                  # KNOWN: bwork 100 hundredths = 1 point per work unit
    build_work_share: 0.5                # KNOWN: avail / 2
    production_min_efficiency: 60        # KNOWN: produce_sect(): nothing below 60%
    # Redesignation. What fraction of current efficiency survives when a
    # sector's designation changes. Resolution order: exact (from,to) pair,
    # then same-category, then default. Richard 2026-09-07: adjustable, not
    # a fixed rule. (GUESS at the original: it dropped to 0 for most changes.)
    redesignate:
      keep_fraction_default: 0.0             # 0.0 = original behaviour (start over)
      keep_fraction_same_category: 0.0       # e.g. mine -> gold_mine
      keep_fraction_by_pair:                 # "from->to"; either side may be "*". e.g. "warehouse->depot": 0.5
        "sanctuary->*": 1.0                  # GUESS: breaking sanctuary should not cost the 100% you started with
      min_efficiency_after: 0                # floor applied after the fraction
    decay_per_update_if_unowned: 2.0     # abandoned sectors rot

  # --- Mobility --------------------------------------------------------------
  mobility:
    sector_accrual_per_etu: 1.0          # KNOWN: sect_mob_scale 1.0 — a flat 60 per 60-ETU update, cap 127
    sector_max: 127                      # KNOWN
    accrual_efficiency_scaled: false     # KNOWN: mob_inc_sect() ignores efficiency
    accrual_efficiency_floor: 1.0        # (unused while accrual is unscaled)
    # Cost to move ONE weight-unit of commodity INTO a sector, before road discount.
    # KNOWN (sect.config mob0/mob1): every designated land sector 0.4 at 0% efficiency, 0.2 at 100%;
    # wilderness 0.4/0.4 (never improves); mountain 2.4/1.2. Forest and swamp are ours (GUESS).
    move_cost_by_terrain: { wilderness: 0.4, plains: 0.4, forest: 0.6, swamp: 0.8, mountain: 2.4 }
    efficiency_discount: { at_0: 1.0, at_100: 0.5, curve: linear }   # KNOWN: linear mob0 -> mob1
    # Manual move (the `move` command) per-update range — NEW range-and-hold rule
    manual_move_max_sectors_per_update: { base: 100, per_tech_point: 0 }   # KNOWN: the original had no reach limit; mobility is the limit

  # --- Money -----------------------------------------------------------------
  # KNOWN: original taxed civs and paid mil per ETU; research/tech cost money.
  # GUESS at every number.
  money:
    tax_per_civ_per_etu: 0.0083333       # KNOWN: money_civ
    tax_per_uw_per_etu:  0.0017777       # KNOWN: money_uw
    pay_per_mil_per_etu: 0.0833333       # KNOWN: money_mil (ten times a civilian's tax)
    sector_maintenance_per_etu: 0.0      # most sectors free; infra decay is the maintenance sink
    bank_interest_per_bar_per_etu: 0.0025 # KNOWN: bankint 0.25 per update-ish; scaled
    bankruptcy:
      threshold: -500
      # KNOWN: original at negative money seized/halted production; GUESS at effect
      effect: { production_multiplier: 0.5, mobility_multiplier: 0.5 }

  # --- Levels ----------------------------------------------------------------
  # KNOWN (update/nat.c, age.c, constants.c). Tech and research are stocks; each update's
  # production passes limit_level — above `easy` the gain is easy + log_base(prod − easy + 1),
  # capped at 250 — and both age 1% per level_age_rate ETUs. Education and happiness are moving
  # averages of a per-ETU rate: rate = produced × consumption / (civilians × ETUs), happiness
  # also × (1.5 − (E+10)/(E+20)), limited with the flag-1 curve, then
  # level = (level × average_etus + rate × ETUs) / (average_etus + ETUs).
  # Education gates tech/research production (edu5 curve); happiness below
  # (tech − 40)/40 + education/3 breeds unrest in the original (loyalty, revolt) — not modelled yet.
  levels:
    tech:      { easy: 1.0,  log_base: 2.0, start: 0 }          # easy_tech, tech_log_base
    research:  { easy: 0.75, log_base: 2.0, start: 0 }
    education: { easy: 5.0,  log_base: 4.0, consumption: 600000, average_etus: 192, start: 0 }   # edu_cons, edu_avg = 16×12
    happiness: { easy: 5.0,  log_base: 6.0, consumption: 600000, average_etus: 48,  start: 0 }   # hap_cons, hap_avg = 16×3
    level_age_rate: 96          # 1% of tech and research per 96 ETUs; 0 = no decline
    tech_bleed: true            # below a fifth of the leader: 20% chance per update to close a third of the gap
    happiness_requirement_tech_divisor: 40        # hap_req = (tech − 40)/40 + education/3 (for the unrest model, later)
    happiness_requirement_education_divisor: 3

  # --- BTUs ------------------------------------------------------------------
  btu:
    accrual_per_capital_civ_per_etu: 0.0012   # KNOWN: btu_build_rate 0.0012, × ETUs × civilians (≤1000) × efficiency in PERCENT
    scale_by_efficiency_percent: true         # KNOWN: a 100% capital with 1000 civilians refills 640 every update
    capital_civ_cap: 1000                     # KNOWN
    max: 640                                   # KNOWN: max_btus 640
    start: 640
    # Cost per command. KNOWN: original charged 1..3 BTU for most; GUESS table.
    cost_by_command:
      default: 1
      move: 1
      designate: 1
      distribute: 1
      threshold: 1
      deliver: 1
      explore: 2
      telegram: 1
      announce: 1
      build_road: 1
      build_rail: 2
      rail_ship: 2
      build_ship: 2
      sail: 1
      fish: 1
      load: 1
      unload: 1
      lane: 1
      scrap: 1
      scorched_earth_order: 3
      map: 0
      census: 0
      production: 0
      budget: 0

# -----------------------------------------------------------------------------
# DISTRIBUTION — NEW planner replacing the scan-order artifact
# -----------------------------------------------------------------------------
distribution:
  # Reach: max sectors a shipment may travel per update, before road bonus.
  max_reach_sectors: { base: 3, per_tech_point: 0.02, road_bonus_at_100: 2 }   # NEW (the original had no reach limit; see docs/original-rules.md)
  # Who pays a shipment's mobility. sending_sector: the sector the goods leave from pays the
  # whole route (a held parcel's sender is the sector holding it) — KNOWN: the original's
  # move and distribute charged the exporter. transited_sectors: every entered sector pays its
  # own hop (the pre-2026-09-08 rule; it starved a busy distribution centre of all mobility,
  # so nothing could ever be moved into it — Richard 2026-09-08, issue #36).
  mobility_debited_from: sending_sector       # sending_sector | transited_sectors
  partial_delivery: hold_in_place             # hold_in_place | return_to_source | destroy (never)
  # Contention resolution order when demand > supply or mobility:
  #   1. proportional to demand
  #   2. commodity.priority (lower first)
  #   3. seeded RNG
  contention: [proportional, commodity_priority, seeded_rng]
  # A held (in-transit) parcel occupies a sector as "cargo" — captured with it.
  held_cargo_counts_toward_capacity: false
  path_cost: cheapest_mobility                # cheapest_mobility | fewest_hops
  mobility_bonus: 10                          # KNOWN: distribute.c IMPORT_BONUS/EXPORT_BONUS = 10 — ten times cheaper than a hand move
  # NEW (Richard 2026-09-08, issue #40): a threshold set on a mixed selection (`thresh * food 400`,
  # or a rectangle) is multiplied for these designations — a warehouse is where the stock lives, so
  # it gets ×10. A single sector or `*:warehouse` takes the number as typed. Clearing is unaffected.
  mass_threshold_multiplier_by_type: { warehouse: 10, city: 10 }
  # Deliver orders (KNOWN: deliver.c; Richard 2026-09-09, issue #45): per sector and commodity, a
  # direction and a threshold. Every update whatever is above the threshold moves one hex that way,
  # the sender paying mobility, if that hex is yours. The receiver applies its own orders at the
  # next update, so a chain advances one hop per update and never depends on scan order.
  # GUESS: the original charged deliveries the plain move cost; ours gets the distribution discount.
  deliver_mobility_bonus: 10
  # null = continuous quantities (allocation is exactly proportional and therefore exactly
  # direction-symmetric). Set e.g. 1.0 to ship whole units; the last indivisible unit then
  # goes by commodity priority, then seeded RNG — which is deliberately NOT rotation-symmetric.
  quantum: null

# -----------------------------------------------------------------------------
# INFRASTRUCTURE — NEW: per-sector road/rail, independent of designation
# -----------------------------------------------------------------------------
infrastructure:
  road:
    # KNOWN (infra.config "road network": l_b 200, h_b 200, bmob 100, cost 200 per 100 points):
    # 2 lcm + 2 hcm + 1 sector mobility + $2 per point, no work. The original built roads on
    # demand with the `improve` command; ours is a standing order limited per update (NEW cap).
    build_materials_per_point: { lcm: 2, hcm: 2, cash: 2 }
    work_per_point: 0
    mobility_per_point: 1
    max_points_per_update: 10
    cost_multiplier_by_terrain: { wilderness: 1.2, plains: 1.0, forest: 1.6, swamp: 2.5, mountain: 3.0 }
    max_level_by_terrain:       { wilderness: 100, plains: 100, forest: 90, swamp: 60, mountain: 60 }
    # Mobility cost multiplier as a function of road_level: 1.0 at 0, min_multiplier at 100.
    mobility_discount_curve: { type: linear, at_0: 1.0, at_100: 0.1 }   # KNOWN: sector_mcost(): cost -= base × 0.009 × road
    decay_per_update: 0.5
    maintenance_cash_per_point_per_update: 0.05
    combat_damage_fraction: 0.30            # fraction of level lost when sector is captured
  rail:
    tech_required: 60
    # KNOWN (infra.config "rail network": l_b 100, h_b 100, bmob 100, cost 100 per 100 points):
    # 1 lcm + 1 hcm + 1 sector mobility + $1 per point, no work. Richard 2026-09-08: highways
    # and railroads must require materials to build — they do. Bridges and tunnels are ours (NEW).
    build_materials_per_point: { lcm: 1, hcm: 1, cash: 1 }
    work_per_point: 0
    mobility_per_point: 1
    max_points_per_update: 5
    requires_depot_endpoints: true
    min_level_to_carry: 20                  # a segment below this breaks the chain
    capacity_per_update_at_100: 5000        # weight-units per line per update, x depot eff
    cost_per_shipment: by_volume            # by_volume | by_distance (never)
    cash_per_100_units_shipped: 2
    # NEW (Richard 2026-09-09): "Rail is cheap to move on, especially sheer tonnage — 1/5 the price of
    # mob." A train pays the sending depot's mobility at this fraction of the road cost of the hops it
    # makes this update (terrain × efficiency × road discount, as a hand move would pay). Was free.
    mobility_multiplier: 0.2
    max_sectors_per_update: { base: 8, per_tech_point: 0.05 }
    decay_per_update: 1.0
    maintenance_cash_per_point_per_update: 0.20
    severed_route_behavior: strand_in_place
    combat_damage_fraction: 0.50
    cost_multiplier_by_terrain: { wilderness: 1.2, plains: 1.0, forest: 1.8, swamp: 4.0, mountain: 5.0 }
    max_level_by_terrain:       { wilderness: 100, plains: 100, forest: 80, swamp: 40, mountain: 50 }
    # Crossing water/mountain needs a bridge/tunnel: extra one-time cost.
    bridge: { tech_required: 90, materials: { hcm: 200, lcm: 50, cash: 2000 } }
    tunnel: { tech_required: 120, materials: { hcm: 400, lcm: 50, cash: 5000 } }

# -----------------------------------------------------------------------------
# CAPTURE / SPOILS — NEW
# -----------------------------------------------------------------------------
capture:
  cargo_destroyed_fraction: 0.25          # of held cargo, lost in the fighting
  stock_destroyed_fraction: 0.10          # of resident sector stock
  scorched_earth_btu_cost: 3
  scorched_earth_destroy_fraction: 1.0

# -----------------------------------------------------------------------------
# DETECTION — NEW probabilistic model (original was binary radar range)
# -----------------------------------------------------------------------------
detection:
  model: probabilistic
  radar:
    nominal_range_at_100: 12                # sectors, at radar_level 100 & eff 100
    range_by_radar_level: linear            # range scales linearly with radar_level x eff
    elevation_bonus_per_100m: 0.4           # +sectors of nominal range per 100 m station elevation
    tech_bonus_per_point: 0.02
    decay_curve: sigmoid                    # p(d) = 1 / (1 + exp(k*(d/range - midpoint)))
    sigmoid_k: 8.0
    sigmoid_midpoint: 0.85
    radar_level_build: { lcm: 2.0, hcm: 1.0, cash: 20, max_points_per_update: 5, decay_per_update: 0.5 }
  # Signature multiplies p; >1 easier to see.
  target_signature: { army: 1.8, fleet: 2.0, single_unit: 0.6, plane: 0.8, held_cargo: 0.2, sector: 1.0 }
  masking_by_terrain: { forest: 0.7, mountain: 0.8, swamp: 0.9 }   # multiplier on p for targets IN that terrain
  contact_staleness_updates: 3            # after this many updates a contact is "stale", then removed
  contact_confidence_bands: { firm: 0.8, probable: 0.4 }           # UI rendering thresholds
  ship:  { nominal_range: 4, decay_curve: sigmoid }
  plane: { nominal_range: 8, decay_curve: sigmoid }
  satellite: { enabled: false, nominal_range: 30 }
  # Adjacent owned sectors are always seen (KNOWN: original showed neighbours).
  adjacency_always_visible: true

# -----------------------------------------------------------------------------
# TECH / LEVEL CURVES (cross-reference into economy.curves)
# -----------------------------------------------------------------------------
tech:
  curves:
    research_to_tech: level_diminishing
    education_to_research: level_diminishing
  gates:                                   # things unlocked by tech level; unit table has its own
    rail: 60
    radar: 40
    airfield: 30
    uranium_mine: 100
    nuclear_plant: 200

# -----------------------------------------------------------------------------
# UNITS — M5. Schema reserved; the table lives in units.yaml.
# -----------------------------------------------------------------------------
units:
  enabled: true
  table: units.yaml
  # SHIPS — NEW (Richard 2026-09-09, issue #56). A data table gated on tech; every number a GUESS to tune
  # except where marked. Harbours build them from their own lcm/hcm and cash; a hull leaves the yard at
  # start_efficiency and fits out while docked. Speed is sea hexes per update at 100%, × efficiency.
  ships:
    start_efficiency: 20               # KNOWN: a new hull is 20%
    dock_points_per_update: 20
    dock_materials_per_point: { lcm: 1, cash: 2 }
    harbor_min_efficiency: 60
    fuel: false                        # phase 1: no petrol
    crews: false                       # phase 1: no crews
    auto_unload_in_harbor: true        # a fishing boat home from the grounds lands its catch
    fishing_food_per_etu_per_fertility_point: 0.1   # rate 1, fertility 50, 60 ETUs, 100% -> 300 food per update
    # A hull keeps the tech it was laid at (KNOWN: ship tech) and sails class speed × this multiplier
    # (Richard 2026-09-09: "each ship has a speed, based on tech level"). GUESS at the numbers.
    speed_tech_multiplier: { at_0: 1.0, per_tech_point: 0.01, max: 2.5 }
    # The fishing mission (Richard 2026-09-09: "travel around in a random path, fishing, come back to
    # harbour, unload, repeat"): roam within radius of home, hop up to wander_hops between casts
    # (richer water more likely), turn for home when the hold is this full. GUESS.
    fishing: { radius: 6, wander_hops: 2, return_when_hold_fraction: 0.9 }
    classes:
      - { id: fishing_boat,            name: fishing boat,            glyph: f, role: fishing, tech_required: 0,  build: { lcm: 25, cash: 300 },             hold: 300,  speed: 3, fishing_rate: 1.0 }
      - { id: industrial_fishing_boat, name: industrial fishing boat, glyph: F, role: fishing, tech_required: 20, build: { lcm: 60, hcm: 30, cash: 1500 },   hold: 1200, speed: 4, fishing_rate: 3.0 }
      - { id: cargo_ship,              name: cargo ship,              glyph: c, role: cargo,   tech_required: 0,  build: { lcm: 60, hcm: 30, cash: 1000 },   hold: 600,  speed: 3, carries: [all] }
      - { id: super_cargo,             name: super cargo ship,        glyph: C, role: cargo,   tech_required: 25, build: { lcm: 150, hcm: 100, cash: 4000 }, hold: 2400, speed: 4, carries: [all] }
      - { id: tanker,                  name: tanker,                  glyph: t, role: tanker,  tech_required: 15, build: { lcm: 80, hcm: 40, cash: 1500 },   hold: 1500, speed: 3, carries: [oil, pet] }
      - { id: super_tanker,            name: super tanker,            glyph: T, role: tanker,  tech_required: 35, build: { lcm: 200, hcm: 120, cash: 6000 }, hold: 6000, speed: 4, carries: [oil, pet] }
      - { id: luxury_craft,            name: luxury craft,            glyph: l, role: luxury,  tech_required: 30, build: { lcm: 120, hcm: 40, cash: 5000 },  hold: 100,  speed: 3, happiness_per_etu: 1.0, carries: [civ], upkeep_per_update: { cash: 50 } }
      # warships need guns, shells and oil in the harbour to lay down (Richard 2026-09-09); fuel per voyage comes with units.ships.fuel
      - { id: destroyer,               name: destroyer,               glyph: d, role: warship, tech_required: 40, build: { lcm: 100, hcm: 150, gun: 10, shell: 50, oil: 50, cash: 5000 }, hold: 200,  speed: 5 }
      - { id: frigate,                 name: frigate,                 glyph: g, role: warship, tech_required: 45, build: { lcm: 120, hcm: 200, gun: 15, shell: 80, oil: 80, cash: 7000 }, hold: 300,  speed: 5 }
      - { id: submarine,               name: submarine,               glyph: s, role: submarine, tech_required: 50, build: { lcm: 100, hcm: 250, gun: 5, shell: 60, oil: 100, cash: 9000 }, hold: 100, speed: 4 }
      - { id: battleship,              name: battleship,              glyph: b, role: warship, tech_required: 60, build: { lcm: 200, hcm: 600, gun: 40, shell: 200, oil: 200, cash: 20000 }, hold: 500, speed: 4 }
      - { id: carrier,                 name: aircraft carrier,        glyph: v, role: warship, tech_required: 70, build: { lcm: 300, hcm: 800, gun: 20, shell: 100, oil: 300, cash: 40000 }, hold: 800, speed: 4 }

# -----------------------------------------------------------------------------
# AGENTS — NEW
# -----------------------------------------------------------------------------
agents:
  turn_window_seconds: 600                 # wall-clock timeout per agent turn
  retries: 1
  context_max_tokens: 60000                # truncate oldest-first above this
  scratchpad_max_chars: 8000
  session_windows_per_day_default: 3       # calibration protocol default
  # Provider credentials come from env: ANTHROPIC_API_KEY, OPENAI_API_KEY, XAI_API_KEY
  adapters: { anthropic: { env_key: ANTHROPIC_API_KEY }, openai: { env_key: OPENAI_API_KEY }, xai: { env_key: XAI_API_KEY } }
  # Diplomacy switch for tournament control arm. When false, telegram/announce
  # commands are rejected for EVERY country (humans too), so the arm is clean.
  diplomacy: true

# -----------------------------------------------------------------------------
# HANDICAP DEFAULTS — per-country override under players.countries[].handicap
# -----------------------------------------------------------------------------
handicap_defaults:
  btu_rate: 1.00
  btu_cap: 1.00
  production: 1.00
  mobility: 1.00
  research_rate: 1.00
  starting_commodities: 1.00
  command_budget_per_update: null
  session_windows_per_day: null            # null = unlimited (humans); agents default from agents.*

# -----------------------------------------------------------------------------
# SCORING — composite, never BTUs
# -----------------------------------------------------------------------------
scoring:
  weights: { civilians: 1.0, total_efficiency: 0.5, tech: 20.0, treasury: 0.01, territory: 5.0, survival: 1000.0 }
  # When units enabled, survival+territory dominate:
  weights_with_units: { civilians: 0.5, total_efficiency: 0.25, tech: 10.0, treasury: 0.005, territory: 20.0, survival: 5000.0 }
  report_score_per_btu: true

# -----------------------------------------------------------------------------
# OPTIONS — feature flags (KNOWN: original had a similar option list)
# -----------------------------------------------------------------------------
options:
  fallout: true
  plague: true
  loans: false
  market: true
  hidden: true              # KNOWN: HIDDEN — countries only see those they have contacted
  scorched_earth: true
  sanctuary: true
  interest: true
  demand_update: false      # KNOWN: original allowed player-demanded updates; off by default
