# Classic: 128x64, daily updates, months long. Inherits everything from
# ../schema.yaml; only overrides appear here.
extends: ../schema.yaml
world: { name: "Classic", width: 128, height: 64 }
schedule: { update_interval: "24h", etus_per_update: 60 }
players: { max_countries: 40 }
units: { enabled: true }
# Issue #153: research raises the population ceiling (the original's RES_POP): 550 a sector at
# research 0, toward 1000. Without it research was nearly inert next to tech.
economy: { population: { max_pop_research_curve: { type: res_pop } } }
