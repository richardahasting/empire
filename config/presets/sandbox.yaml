# Sandbox: one country, manual updates only, everything unlocked, generous
# stocks. For poking at mechanics and for the flow-visualisation work.
extends: ../schema.yaml
world: { name: "Sandbox", width: 32, height: 32, terrain: { land_fraction: 0.5 } }
schedule: { update_interval: "0", etus_per_update: 60 }   # "0" = manual trigger only
players:
  max_countries: 1
  starting_cash: 1000000
  starting_levels: { tech: 150, research: 150, education: 150, happiness: 50 }
  starting_commodities:
    capital:   { civ: 1000, mil: 100, food: 1000, iron: 1000, lcm: 1000, hcm: 1000, oil: 1000, dust: 1000 }
    sanctuary: { civ: 1000, mil: 100, food: 1000, iron: 1000, lcm: 1000, hcm: 1000, oil: 1000, dust: 1000 }
economy: { btu: { max: 1000, start: 1000 } }
units: { enabled: true }
options: { hidden: false, plague: false, fallout: false }
